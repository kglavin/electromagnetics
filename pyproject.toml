[project]
name = "electromagnetics"
version = "0.1.0"
description = "Computational electromagnetics study patch alongside Malthe-Sørenssen, Elementary Electromagnetism Using Python"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "sympy",
    "numba",
    "plotly",
    "jupyterlab",
    "ipywidgets",
    "manim",
]

[dependency-groups]
dev = [
    "pytest",
    "nbconvert",
    "ipykernel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emlib"]
